<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Проверка музыки · лупа и волна</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #edf1f4; color: #142d3d; font: 16px system-ui, sans-serif; }
    main { max-width: 1056px; margin: auto; padding: 34px 28px; }
    h1 { margin: 0 0 24px; font-size: clamp(24px, 4vw, 32px); letter-spacing: -.025em; }
    .cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
    article { min-width: 0; padding: 22px; border: 1px solid #d9e2e8; border-radius: 19px; background: #fff; }
    h2 { margin: 0; font-size: 18px; }
    p { margin: 4px 0 16px; color: #526675; font-size: 13px; }
    img { display: block; object-fit: contain; }
    .main-icon { width: min(100%, 184px); height: auto; aspect-ratio: 1; margin: 0 auto 22px; }
    .sizes { display: flex; align-items: end; justify-content: center; gap: 20px; border-top: 1px solid #e0e7ec; padding-top: 16px; }
    figure { display: grid; justify-items: center; gap: 8px; margin: 0; }
    figcaption { color: #526675; font-size: 11px; }
    @media (max-width: 700px) {
      main { max-width: 440px; padding: 24px 16px; }
      .cards { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Проверка музыки · лупа и волна</h1>
    <div class="cards">
      <article>
        <h2>S-кривая 4 с</h2>
        <p>Иконка первой программы</p>
        <img class="main-icon" src="s-curve-reference.png" width="184" height="184" alt="Светлая S-кривая на тёмном фоне">
        <div class="sizes">
          <figure><img src="s-curve-reference.png" width="64" height="64" alt=""><figcaption>64 px</figcaption></figure>
          <figure><img src="s-curve-reference.png" width="32" height="32" alt=""><figcaption>32 px</figcaption></figure>
          <figure><img src="s-curve-reference.png" width="16" height="16" alt=""><figcaption>16 px</figcaption></figure>
        </div>
      </article>
      <article>
        <h2>1. Точка</h2>
        <p>Метка прямо на волне</p>
        <img class="main-icon" src="point.svg" width="184" height="184" alt="Лупа с волной и точкой на ней">
        <div class="sizes">
          <figure><img src="point.svg" width="64" height="64" alt=""><figcaption>64 px</figcaption></figure>
          <figure><img src="point.svg" width="32" height="32" alt=""><figcaption>32 px</figcaption></figure>
          <figure><img src="point.svg" width="16" height="16" alt=""><figcaption>16 px</figcaption></figure>
        </div>
      </article>
      <article>
        <h2>2. Фрагмент</h2>
        <p>Подчёркнутый участок волны</p>
        <img class="main-icon" src="segment.svg" width="184" height="184" alt="Лупа с волной и короткой чертой под ней">
        <div class="sizes">
          <figure><img src="segment.svg" width="64" height="64" alt=""><figcaption>64 px</figcaption></figure>
          <figure><img src="segment.svg" width="32" height="32" alt=""><figcaption>32 px</figcaption></figure>
          <figure><img src="segment.svg" width="16" height="16" alt=""><figcaption>16 px</figcaption></figure>
        </div>
      </article>
    </div>
  </main>
</body>
</html>
